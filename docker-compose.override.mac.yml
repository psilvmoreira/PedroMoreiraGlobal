services:
  pedromoreira.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5001
      - ASPNETCORE_HTTPS_PORTS=5002
      - USER_SECRETS_ID=aspnet-PedroMoreira.API-ad71faa8-6f00-44ce-929d-6996a548dcc4
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ~/.microsoft/usersecrets:/home/app/.microsoft/usersecrets:ro
      - ~/.aspnet/Https:/home/app/.aspnet/https:ro
  pedromoreira.database:
    ports:
      - "5432:5432"
    volumes:
      - db:/docker-entrypoint-initdb.d
      - db:/var/lib/postgresql/data